name: HYROX Monitor

# Driven by cron-job.org via repository_dispatch (GitHub's own cron is
# unreliable/delayed). schedule is kept only as a best-effort fallback.
on:
  repository_dispatch:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: node index.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' }}
